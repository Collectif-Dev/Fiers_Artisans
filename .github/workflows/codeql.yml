name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop", "vers_production" ]
  pull_request:
    branches: [ "main", "develop", "vers_production" ]
  schedule:
    # Exécuter l'analyse CodeQL chaque lundi à 2h du matin UTC
    - cron: '0 2 * * 1'

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            admin-web/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      # Builder le frontend Admin Next.js
      - name: Install dependencies (Admin Web)
        working-directory: ./admin-web
        run: npm ci

      - name: Build Admin Web (Next.js)
        working-directory: ./admin-web
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend
          - admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.project }}/package-lock.json'

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run lint
        working-directory: ./${{ matrix.project }}
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.project }}/package-lock.json'

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run tests
        working-directory: ./${{ matrix.project }}
        run: npm test
