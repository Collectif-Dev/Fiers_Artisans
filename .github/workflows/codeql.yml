name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop", "vers_production" ]
  pull_request:
    branches: [ "main", "develop", "vers_production" ]
  schedule:
    # Exécuter l'analyse CodeQL chaque lundi à 2h du matin UTC
    - cron: '0 2 * * 1'

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - 'typescript'
          - 'javascript'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Utiliser le mode manuel pour éviter les erreurs d'autobuild
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      # Builder manuellement le backend NestJS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      # Builder le frontend Admin Next.js
      - name: Install dependencies (Admin Web)
        working-directory: ./admin-web
        run: npm ci

      - name: Build Admin Web (Next.js)
        working-directory: ./admin-web
        run: npm run build

      # Exécuter l'analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # Upload les résultats SARIF
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'results'
          wait-for-processing: true

  # Job optionnel : Linter ESLint
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend
          - admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (${{ matrix.project }})
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run ESLint (${{ matrix.project }})
        working-directory: ./${{ matrix.project }}
        run: npm run lint --if-present
        continue-on-error: true

  # Job optionnel : Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (${{ matrix.project }})
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run Tests (${{ matrix.project }})
        working-directory: ./${{ matrix.project }}
        run: npm run test --if-present
        continue-on-error: true
