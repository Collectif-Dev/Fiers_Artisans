services:
  portainer:
    image: portainer/portainer-ce:2.27.8@sha256:d27f76194b719bfe2a34779d51798a7adf02510cfba69ebcb538267f75aa4f47
    container_name: fiers-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    user: "0:986"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
volumes:
  portainer_data:
